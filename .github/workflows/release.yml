name: Release

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      force_deploy:
        description: Force deploy
        type: boolean
      force_release:
        description: Force release
        type: boolean
      force_pr:
        description: Force pull request
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/flowcanon/flow-deploy-docs

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: pipeline
        uses: flowcanon/release-builder/pipeline@v3
        with:
          force-pr: ${{ inputs.force_pr || false }}
    outputs:
      created-tag: ${{ steps.pipeline.outputs.created-tag }}
      current-version: ${{ steps.pipeline.outputs.current-version }}

  build_release:
    if: inputs.force_release || needs.release.outputs.created-tag
    name: Build release
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build binaries
        run: |
          docker build --target builder-musl -t flow-deploy-musl -f Dockerfile.build .
          docker build --target builder-glibc -t flow-deploy-glibc -f Dockerfile.build .
          mkdir -p dist
          docker cp $(docker create flow-deploy-musl):/build/dist/flow-deploy-linux-musl dist/
          docker cp $(docker create flow-deploy-glibc):/build/dist/flow-deploy-linux-glibc dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.current-version }}
          generate_release_notes: true
          files: |
            dist/flow-deploy-linux-musl
            dist/flow-deploy-linux-glibc

  build_and_deploy:
    # build_release is skipped on a force_deploy run that cut no release; a
    # plain `if:` implies success(), which would skip this job with it.
    if: >-
      !cancelled()
      && needs.release.result == 'success'
      && (needs.build_release.result == 'success' || needs.build_release.result == 'skipped')
      && (inputs.force_deploy || needs.release.outputs.created-tag)
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [release, build_release]
    environment: coruscant
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deploy by the release's version tag (the git tag build_release made,
      # v<version>), or by the commit SHA on a force_deploy run with no release.
      - id: deploy_tag
        name: Choose the deploy tag
        env:
          CREATED_TAG: ${{ needs.release.outputs.created-tag }}
          VERSION_TAG: v${{ needs.release.outputs.current-version }}
        run: |
          if [ -n "$CREATED_TAG" ]; then
            echo "tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      # The image is pushed under every name a deploy or a revert may use:
      # the version tag (releases only), and the short and full SHA.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=v${{ needs.release.outputs.current-version }},enable=${{ needs.release.outputs.created-tag != '' }}
            type=sha,prefix=
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - uses: flowcanon/deploy-action@master
        with:
          tag: ${{ steps.deploy_tag.outputs.tag }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ vars.HOST_NAME }}
          user: ${{ vars.HOST_USER }}
          ssh-port: ${{ vars.SSH_PORT }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          upgrade: true
