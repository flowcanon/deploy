name: Release

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      force_deploy:
        description: Force deploy
        type: boolean
      force_release:
        description: Force release
        type: boolean
      force_pr:
        description: Force pull request
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/flowcanon/flow-deploy-docs

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: pipeline
        # flowcanon/release-builder@v3 branch tip as of audit
        uses: flowcanon/release-builder/pipeline@35deb72e2a585d6a7e4c230d1052a763ac47402b # v3
        with:
          force-pr: ${{ inputs.force_pr || false }}
    outputs:
      created-tag: ${{ steps.pipeline.outputs.created-tag }}
      current-version: ${{ steps.pipeline.outputs.current-version }}

  build_release:
    if: inputs.force_release || needs.release.outputs.created-tag
    name: Build release
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build binaries
        run: |
          docker build --target builder-musl -t flow-deploy-musl -f Dockerfile.build .
          docker build --target builder-glibc -t flow-deploy-glibc -f Dockerfile.build .
          mkdir -p dist
          docker cp $(docker create flow-deploy-musl):/build/dist/flow-deploy-linux-musl dist/
          docker cp $(docker create flow-deploy-glibc):/build/dist/flow-deploy-linux-glibc dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.release.outputs.current-version }}
          generate_release_notes: true
          files: |
            dist/flow-deploy-linux-musl
            dist/flow-deploy-linux-glibc

  build_and_deploy:
    if: inputs.force_deploy || needs.release.outputs.created-tag
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [release, build_release]
    environment: coruscant
    permissions:
      contents: read
      packages: write

    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - uses: flowcanon/deploy-action@59939e9e76a264708024cd3d9c1871701294b27c # master @ audit
        with:
          tag: ${{ steps.meta.outputs.version }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ vars.HOST_NAME }}
          user: ${{ vars.HOST_USER }}
          ssh-port: ${{ vars.SSH_PORT }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          upgrade: true
